[package]
name = "telesthitium"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Reference relay hub for the Telesthete wire protocol (SPEC §10)."

[lib]
name = "telesthitium"
path = "src/lib.rs"

[[bin]]
name = "telesthete-hub"
path = "src/main.rs"

[dependencies]
telesthete = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = { workspace = true }
# TLS identity for WSS (§9.3) and WebTransport (§9.6). rcgen defaults to the
# `ring` backend; every rustls-family dep below is pinned to `ring` too, to
# avoid the multi-provider `CryptoProvider` ambiguity panic.
rcgen = "0.14"
sha2 = { workspace = true }
time = "0.3"
thiserror = { workspace = true }
# WSS (§9.3). TLS is wrapped by us via tokio-rustls, so tokio-tungstenite needs
# no TLS features. Everything rustls-family is pinned to `ring` to match rcgen's
# default backend (avoids the multi-CryptoProvider ambiguity panic).
tokio-tungstenite = "0.30"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = "1"
futures-util = { version = "0.3", features = ["sink"] }
bytes = { workspace = true }
# WebTransport (§9.6). Shares rustls 0.23 / ring with the WSS stack.
wtransport = "0.7"
url = "2"
# AF_UNIX SOCK_SEQPACKET (§9.4) — tokio has no native async SEQPACKET, so we
# drive a socket2 socket through tokio's AsyncFd.
socket2 = { version = "0.5", features = ["all"] }
