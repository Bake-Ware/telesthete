[package]
name = "telesthete"
version = "0.1.0"
edition = "2021"
description = "Rook wire transport for the spatial thin client: PSK-authenticated, encrypted hybrid TCP+UDP carrying spatial-proto channels."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
lto = true
